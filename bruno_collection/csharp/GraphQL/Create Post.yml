info:
  name: Create Post
  type: graphql
  seq: 4

graphql:
  method: POST
  url: http://localhost:5000/graphql
  body:
    query: |-
      mutation {
        createPost(
          title: "Пост из GraphQL"
          content: "Создано через мутацию"
          authorId: 1
        ) {
          id
          title
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
