info:
  name: Get Author By Variable
  type: graphql
  seq: 2

graphql:
  method: POST
  url: http://localhost:5000/graphql
  body:
    query: |-
      query GetAuthor($authorId: Int!) {
        author(id: $authorId) {
          name
          posts {
            title
          }
        }
      }
    variables: |-
      {
        "authorId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
