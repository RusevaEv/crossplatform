info:
  name: Update text comments 1
  type: graphql
  seq: 4

graphql:
  method: POST
  url: ""
  body:
    query: |-
      mutation {
        updateComment(id: 1, text: "Отличный разбор и хорошие решения задачи!") {
          id
          text
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
