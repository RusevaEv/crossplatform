info:
  name: "Create post with fragments "
  type: graphql
  seq: 6

graphql:
  method: POST
  url: http://localhost:8000/graphql
  body:
    query: |-
      fragment PostFields on PostType {
        id
        title
        content
        authorId
      }

      mutation CreateNewPost {
        createPost(
          title: "Новый пост из GraphQL"
          content: "Текст этого поста"
          authorId: 1
        ) {
          ...PostFields
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
