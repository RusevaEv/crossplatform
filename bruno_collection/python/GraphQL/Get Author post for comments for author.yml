info:
  name: "Get Author post for comments for author "
  type: graphql
  seq: 3

graphql:
  method: POST
  url: http://localhost:8000/graphql
  body:
    query: |-
      query {
        authors {
          name
          posts {
            title
            comments {
              text
              author { name }
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
